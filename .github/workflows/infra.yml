name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the regenerated plan only if its change digest matches a reviewed plan run
        type: boolean
        default: false
      reviewed_plan_sha256:
        description: Change digest from the prior reviewed plan run (required for apply)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: lobby-relay-production-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Validate protected environment inputs
        env:
          TF_VARIABLES_JSON: ${{ vars.TF_VARIABLES_JSON }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          APPLY_REQUESTED: ${{ inputs.apply }}
          REVIEWED_DIGEST: ${{ inputs.reviewed_plan_sha256 }}
        run: |
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, re
          allowed = {
              "aws_account_id", "cloudflare_account_id", "cloudflare_zone_id",
              "api_hostname", "relay_hostname", "relay_udp_port", "deploy_hostname",
              "deploy_access_service_token_id", "admin_ipv4_cidr", "ssh_public_key",
              "budget_email", "monthly_budget_usd", "network_out_alarm_bytes_per_period",
          }
          values = json.loads(os.environ["TF_VARIABLES_JSON"])
          if not isinstance(values, dict) or not values or set(values) - allowed:
              raise SystemExit("TF_VARIABLES_JSON must contain only documented nonsecret infrastructure inputs")
          account = values.get("aws_account_id", "")
          if not re.fullmatch(r"[0-9]{12}", account):
              raise SystemExit("Verified AWS account ID required")
          if os.environ["ROLE_ARN"] != f"arn:aws:iam::{account}:role/lobby-relay-github-infra":
              raise SystemExit("AWS_ROLE_ARN must match the bootstrap role in the configured account")
          bucket = os.environ["STATE_BUCKET"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]", bucket):
              raise SystemExit("Verified state bucket required")
          if os.environ["APPLY_REQUESTED"] == "true" and not re.fullmatch(r"[0-9a-f]{64}", os.environ["REVIEWED_DIGEST"]):
              raise SystemExit("Apply requires the SHA256 change digest from a reviewed plan run")
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lobby-relay-infra"
          directory.mkdir(mode=0o700)
          (directory / "values.tfvars.json").write_text(json.dumps(values))
          (directory / "backend.tfbackend").write_text("bucket = " + json.dumps(bucket) + "\n")
          PY
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: lobby-relay-infra-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Initialize private state and validate
        run: |
          terraform -chdir=infrastructure/terraform init -input=false -lockfile=readonly -backend-config="$RUNNER_TEMP/lobby-relay-infra/backend.tfbackend"
          terraform -chdir=infrastructure/terraform validate
      - name: Plan and record a review digest
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          terraform -chdir=infrastructure/terraform plan -input=false -lock-timeout=60s -var-file="$RUNNER_TEMP/lobby-relay-infra/values.tfvars.json" -out="$RUNNER_TEMP/lobby-relay-infra/production.tfplan"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lobby-relay-infra"
          plan = json.loads(subprocess.check_output(["terraform", "-chdir=infrastructure/terraform", "show", "-json", str(directory / "production.tfplan")]))
          # JSON contains secrets: hash in memory, never emit or upload it.
          review = {key: plan.get(key) for key in ("resource_changes", "resource_drift", "output_changes")}
          review["commit"] = os.environ["GITHUB_SHA"]
          digest = hashlib.sha256(json.dumps(review, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (directory / "change-sha256").write_text(digest)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Reviewed commit: `{os.environ['GITHUB_SHA']}`\n\nChange digest: `{digest}`\n\nReview the redacted plan log. To apply, dispatch this same commit with apply enabled and this digest. Any changed plan requires another review. No binary plan or JSON artifact is uploaded.\n")
          PY
      - name: Apply only the reviewed changes
        if: inputs.apply
        env:
          REVIEWED_DIGEST: ${{ inputs.reviewed_plan_sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(cat "$RUNNER_TEMP/lobby-relay-infra/change-sha256")" = "$REVIEWED_DIGEST" || {
            echo 'Plan differs from reviewed changes; review this plan and dispatch again.' >&2
            exit 1
          }
          terraform -chdir=infrastructure/terraform apply -input=false -lock-timeout=60s "$RUNNER_TEMP/lobby-relay-infra/production.tfplan"
      - name: Remove local state metadata and sensitive plans
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/lobby-relay-infra" infrastructure/terraform/.terraform
